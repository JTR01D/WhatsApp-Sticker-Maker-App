name: Build WhatsApp Sticker Maker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure Fixed Debug Keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "chore: persist fixed debug.keystore for consistent update signatures"
            git push origin main
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/*.apk release_assets/WhatsAppStickerMaker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppStickerMaker-APK
          path: release_assets/WhatsAppStickerMaker.apk
          retention-days: 7

      - name: Update 'latest' Git Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Release build ${{ github.sha }}"
          git push origin latest --force

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WhatsApp Sticker Maker - Última Versión (Latest)"
          body: |
            ## 🚀 WhatsApp Sticker Maker (APK Oficial)
            
            Descarga directa y pública del instalador para Android (no requiere cuenta de GitHub):
            
            - 📲 **Descargar APK**: [WhatsAppStickerMaker.apk](https://github.com/${{ github.repository }}/releases/download/latest/WhatsAppStickerMaker.apk)
            - 🛡️ **Privacidad**: 100% Offline (Sin permisos de Internet)
            - 💎 **Diseño**: Liquid Glass & Material Design 3
            - 🌐 **Idiomas**: Español 🇪🇸 / English 🇺🇸
          files: release_assets/WhatsAppStickerMaker.apk
          make_latest: true

      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
